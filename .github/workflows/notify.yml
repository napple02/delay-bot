name: 遅延情報をDiscord通知

on:
  # cron は Cloudflare Workers へ移行済み。このワークフローは手動テスト用のみ残す。
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node notify.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ODPT_TOKEN: ${{ secrets.ODPT_TOKEN }} # Yahoo障害時フォールバック用（未設定可）
