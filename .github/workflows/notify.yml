name: 遅延情報をDiscord通知

on:
  schedule:
    # GitHub Actions の cron は UTC。JST = UTC+9。
    - cron: '50 20 * * *' # 5:50 JST（前日20:50 UTC）
    - cron: '50 21 * * *' # 6:50 JST（前日21:50 UTC）
  workflow_dispatch: {} # 手動実行用

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node notify.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
